
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-portal
  template:
    metadata:
      labels:
        app: learning-portal
    spec:
      containers:
        - name: learning-portal
          image: asadhamdan10/learning-portal:1.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: learning-portal-service
spec:
  type: NodePort
  selector:
    app: learning-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
